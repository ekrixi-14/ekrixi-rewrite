- type: entity
  parent: BaseComputer
  id: EkrixiComputerGunnery
  name: gunnery/targeting computer
  description: Displays important radar and controls linked gunnery. Not designed for host-ships.
  components:
  - type: GunneryComputer
  - type: ActivatableUI
    key: enum.GunnerComputerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GunnerComputerUiKey.Key:
        type: GunnerComputerBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    sprite: _Ekrixi/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: aiming_keyboard
    - map: ["computerLayerScreen"]
      state: gun_aiming
    - map: ["computerLayerKeys"]
      state: aiming_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: DeviceLinkSource
    ports:
    - EkrixiFire
    - EkrixiAim
    - EkrixiAutofire
  - type: DeviceLinkSink
    ports:
    - EkrixiDataGunnery
    - EkrixiDataRadar
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#43ccb5"
